require:
  - rubocop-rake

AllCops:
  NewCops: enable
  TargetRubyVersion: 3.4

# specs are naturally long blocks
Metrics/BlockLength:
  Exclude:
    - 'spec/**/*'
    - 'model_defs/mddo/*.rb'

# disable several metrics for hand-made models

Metrics/AbcSize:
  Exclude:
    - 'model_defs/mddo/*.rb'

Metrics/MethodLength:
  Exclude:
    - 'model_defs/mddo/*.rb'

Metrics/CyclomaticComplexity:
  Exclude:
    - 'model_defs/mddo/*.rb'

Metrics/PerceivedComplexity:
  Exclude:
    - 'model_defs/mddo/*.rb'
